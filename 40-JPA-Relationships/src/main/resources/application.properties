# =====================================================================
# Topic 40 - JPA Relationships - application settings
# =====================================================================
spring.application.name=jpa-relationships
server.port=8080

spring.datasource.url=jdbc:h2:mem:shopdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANT for this topic: with open-in-view=false, lazy relationships can only be loaded
# INSIDE a transaction (the service layer). This makes LazyInitializationException visible
# instead of hiding it - exactly what we want to learn.
spring.jpa.open-in-view=false

# Let Hibernate count the SQL statements it runs, so the /demo endpoints can SHOW the N+1 problem.
spring.jpa.properties.hibernate.generate_statistics=true
# ... but don't print a statistics block after every request (too noisy).
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
