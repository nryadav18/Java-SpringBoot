# =====================================================================
# Profile "prod" - activated with SPRING_PROFILES_ACTIVE=prod
# (k8s/configmap.yaml and deploy/menu-service.service set it).
# =====================================================================

# Structured JSON logs (Spring Boot 3.4+). Log collectors (ELK, Loki, CloudWatch) parse them easily.
logging.structured.format.console=ecs
logging.level.root=INFO

# Do not show health details to anonymous callers in production
management.endpoint.health.show-details=never

# Errors: never send stack traces to clients
server.error.include-stacktrace=never
server.error.include-message=never
