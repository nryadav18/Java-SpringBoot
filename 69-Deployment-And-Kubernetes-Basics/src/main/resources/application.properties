# =====================================================================
# Defaults for ALL environments. Values that differ per environment are
# overridden by environment variables (Kubernetes ConfigMap / Secret).
# =====================================================================
spring.application.name=menu-service
server.port=8080

# ---- app.* settings (see AppProperties.java). Safe LOCAL defaults only. ----
app.restaurant-name=Spice Garden (local)
app.welcome-message=Hello from your laptop!
app.payment-api-key=dev-only-not-a-real-key

# ---- Graceful shutdown ----
# On SIGTERM (Kubernetes deleting a pod, systemctl stop, docker stop):
# stop accepting NEW requests, let running requests finish (max 20 s), then exit.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
# Adds /actuator/health/liveness and /actuator/health/readiness
# (Spring Boot turns this on automatically inside Kubernetes; we enable it everywhere so you can try it locally)
management.endpoint.health.probes.enabled=true
# Show details like disk space on /actuator/health (fine for learning; use "when-authorized" in production)
management.endpoint.health.show-details=always
# Show build-info (version, time) and java info on /actuator/info
management.info.java.enabled=true
