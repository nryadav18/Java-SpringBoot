# =====================================================================
# k8s/ingress.yaml - OPTIONAL: route outside HTTP traffic to the Service by host/path.
#
# Needs an Ingress CONTROLLER installed in the cluster (e.g. ingress-nginx):
#   minikube:        minikube addons enable ingress
#   Docker Desktop:  kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/cloud/deploy.yaml
# Without a controller this object is accepted but does nothing.
#
# Then open http://menu.localhost/api/menu  (*.localhost resolves to 127.0.0.1 in most browsers)
# =====================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: menu-service
  labels:
    app: menu-service
spec:
  ingressClassName: nginx
  rules:
    - host: menu.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: menu-service
                port:
                  name: http
