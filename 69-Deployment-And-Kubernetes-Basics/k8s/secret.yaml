# =====================================================================
# k8s/secret.yaml - SECRET configuration (passwords, API keys).
#
# "stringData" lets us write plain text; Kubernetes stores it base64-encoded.
# WARNING: base64 is NOT encryption! Anyone who can read this file can read the key.
# This file is for LEARNING. In real projects do NOT commit secrets to Git;
# create them from the command line or a secret manager instead, e.g.
#   kubectl create secret generic menu-service-secret --from-literal=APP_PAYMENT_API_KEY=xyz
# (or use Sealed Secrets / External Secrets Operator / Vault / cloud secret managers)
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: menu-service-secret
  labels:
    app: menu-service
type: Opaque
stringData:
  APP_PAYMENT_API_KEY: "demo-k8s-key-9f2a"
