spring.application.name=security-basics
server.port=8080

# Show WHICH security filters run for each request (great for learning!).
# Change DEBUG to INFO when the console becomes too noisy.
logging.level.org.springframework.security=DEBUG

# NOTE: spring.security.user.name / spring.security.user.password only matter when
# you do NOT define your own UserDetailsService. We define one in SecurityConfig,
# so the "Using generated security password" line does NOT appear in this project.
