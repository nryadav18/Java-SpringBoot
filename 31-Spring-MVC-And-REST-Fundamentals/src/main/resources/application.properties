# Topic 31 - Spring MVC & REST Fundamentals
spring.application.name=rest-basics
server.port=8080

# Pretty-print JSON responses (nice while learning; usually off in production to save bytes)
spring.jackson.serialization.indent-output=true

# Include the error "message" text in Spring Boot's default JSON error response
# (e.g. "Book 99 not found"). Topic 35 builds a proper error format.
server.error.include-message=always

# Uncomment to watch the DispatcherServlet pick a controller for every request:
#logging.level.org.springframework.web=DEBUG
