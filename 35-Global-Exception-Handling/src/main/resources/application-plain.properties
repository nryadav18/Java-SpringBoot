# Profile "plain": NO exception handler is active.
#   mvn spring-boot:run -Dspring-boot.run.profiles=plain
# You see Spring Boot's DEFAULT error JSON (produced by BasicErrorController at /error).
# Our exceptions still get the right status code thanks to @ResponseStatus on each class.

# Show the exception message in the default error JSON (hidden by default).
server.error.include-message=always
