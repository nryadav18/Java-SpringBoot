# Profile "problem": errors use the RFC 9457 ProblemDetail format.
#   mvn spring-boot:run -Dspring-boot.run.profiles=problem
#
# This property makes Spring Boot register its OWN ResponseEntityExceptionHandler,
# so Spring MVC's built-in exceptions (bad JSON, 405, 404 for unknown URLs ...)
# are answered as ProblemDetail - with ZERO code.
#
# In this project we ALSO wrote ProblemDetailExceptionHandler (it extends
# ResponseEntityExceptionHandler and adds our own exceptions). When such a bean
# exists, Boot's auto-configured one steps back, and ours does the whole job.
# Try it: delete ProblemDetailExceptionHandler and see that 405/400 errors are
# still ProblemDetail, while our custom exceptions fall back to @ResponseStatus.
spring.mvc.problemdetails.enabled=true
