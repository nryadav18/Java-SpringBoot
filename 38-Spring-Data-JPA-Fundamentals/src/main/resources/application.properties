# =====================================================================
# Topic 38 - Spring Data JPA Fundamentals - application settings
# =====================================================================
spring.application.name=jpa-basics
server.port=8080

# ---------- DataSource (WHERE is the database?) ----------
# "mem:shopdb" = an in-memory H2 database called shopdb. It disappears when the app stops.
spring.datasource.url=jdbc:h2:mem:shopdb
spring.datasource.username=sa
spring.datasource.password=

# ---------- H2 web console ----------
# Open http://localhost:8080/h2-console  and use JDBC URL: jdbc:h2:mem:shopdb  (user: sa, empty password)
spring.h2.console.enabled=true

# ---------- JPA / Hibernate ----------
# ddl-auto decides what Hibernate does with tables at startup:
#   none | validate | update | create | create-drop
# create-drop = create tables from our @Entity classes at startup, drop them at shutdown.
# Great for learning with H2. NEVER use create/create-drop/update on a real production database (see topic 43).
spring.jpa.hibernate.ddl-auto=create-drop

# Print every SQL statement Hibernate sends, nicely formatted, so we can SEE what JPA does for us.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open-Session-In-View keeps the database session open while JSON is written. It hides bugs
# (see topic 40), so we switch it off and do all database work inside the service layer.
spring.jpa.open-in-view=false
