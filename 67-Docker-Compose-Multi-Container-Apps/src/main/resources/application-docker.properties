# ---------------------------------------------------------------
# Profile "docker" = the app runs INSIDE Docker Compose.
# docker-compose.yml sets SPRING_PROFILES_ACTIVE=docker, so this file is loaded
# ON TOP of application.properties (values here win).
#
# Values come from ENVIRONMENT VARIABLES that Compose passes into the container.
#   ${DB_HOST:mysql}  means: use env var DB_HOST, or "mysql" if it is not set.
# "mysql" is the SERVICE NAME of the database in docker-compose.yml.
# Compose's built-in DNS turns that name into the database container's IP address.
# NEVER use "localhost" here: inside a container, localhost = the container itself!
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:librarydb}
spring.datasource.username=${DB_USER:library}
spring.datasource.password=${DB_PASSWORD:library123}

# The table is created by db/init.sql. "validate" only checks that it matches the entity.
spring.jpa.hibernate.ddl-auto=validate
