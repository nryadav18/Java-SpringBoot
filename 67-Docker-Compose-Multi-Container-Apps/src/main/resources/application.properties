# ---------------------------------------------------------------
# Default profile = running on your laptop WITHOUT Docker.
# Uses an in-memory H2 database so "mvn spring-boot:run" just works.
# ---------------------------------------------------------------
spring.application.name=compose-app
server.port=8080

spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Actuator: expose only health and info. Docker's healthcheck calls /actuator/health
management.endpoints.web.exposure.include=health,info

# Finish running requests before stopping when Docker sends SIGTERM (docker compose stop/down)
server.shutdown=graceful
