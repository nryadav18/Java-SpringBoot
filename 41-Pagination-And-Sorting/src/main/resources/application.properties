# =====================================================================
# Topic 41 - Pagination & Sorting - application settings
# =====================================================================
spring.application.name=pagination
server.port=8080

spring.datasource.url=jdbc:h2:mem:catalogdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Watch the LIMIT/OFFSET (H2: OFFSET ... FETCH FIRST ...) and the extra COUNT query in the console.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Spring Data web paging defaults (used when a controller method has a Pageable parameter) ----------
# Size used when the client sends no "size" parameter.
spring.data.web.pageable.default-page-size=10
# Safety limit: ?size=100000 is silently reduced to 50. Protects the database and the network.
spring.data.web.pageable.max-page-size=50
# Names of the query parameters (these are the defaults, shown here so you know they exist).
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size
spring.data.web.sort.sort-parameter=sort
# false (default): the first page is page=0.  true: the first page is page=1.
spring.data.web.pageable.one-indexed-parameters=false
# How a Page<T> returned directly from a controller is turned into JSON.
# via-dto = a stable, documented PagedModel shape: { "content": [...], "page": { size, number, totalElements, totalPages } }
spring.data.web.pageable.serialization-mode=via-dto
