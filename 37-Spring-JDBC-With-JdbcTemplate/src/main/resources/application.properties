# Topic 37 - Spring JDBC with JdbcTemplate
spring.application.name=spring-jdbc-template
server.port=8080

# ---------- DataSource (Spring Boot creates a HikariCP pool from these) ----------
# "mem" = in-memory database; it disappears when the app stops.
# DB_CLOSE_DELAY=-1 keeps it alive as long as the app runs (even if all connections close).
spring.datasource.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# (driver-class-name is detected from the URL automatically)

# Connection pool settings (defaults shown) - see the lesson
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=StudentPool

# ---------- schema.sql / data.sql ----------
# For embedded databases (H2) the default is already "embedded" (= run them).
# "always" also runs them for real databases like MySQL - only for learning/demo apps!
spring.sql.init.mode=always

# ---------- H2 web console ----------
# Open http://localhost:8080/h2-console  -> JDBC URL: jdbc:h2:mem:studentdb  user: sa  password: (empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Which StudentRepository implementation? ----------
# jdbc-template (default) | named | jdbc-client
app.repository.type=jdbc-template

# ---------- See every SQL statement JdbcTemplate executes ----------
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
