# =====================================================================
# Topic 44 - Task API
# Run: mvn spring-boot:run
# =====================================================================
spring.application.name=task-api

# ---------- Database (H2 in-memory) ----------
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ---------- Pagination limits ----------
# Never let a client ask for 1,000,000 rows: ?size=5000 is cut down to 100.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=10

# ---------- springdoc / OpenAPI ----------
# These two paths are the defaults - written here so you can see and change them.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Sort operations by HTTP method and tags alphabetically in Swagger UI
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Show how long each "Try it out" call took
springdoc.swagger-ui.display-request-duration=true
# In production you may hide the docs:  springdoc.api-docs.enabled=false / springdoc.swagger-ui.enabled=false
