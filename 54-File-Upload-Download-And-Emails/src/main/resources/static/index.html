<!DOCTYPE html>
<!--
  Topic 54 - a tiny upload page served by Spring Boot from src/main/resources/static.
  Open http://localhost:8080 while the app runs.
  It uses plain HTML forms (multipart/form-data) + a few lines of JavaScript to list files.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Center</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #1d2330; }
    fieldset { border: 1px solid #dde1e8; border-radius: 8px; margin: 16px 0; padding: 12px 16px; }
    li { margin: 6px 0; }
    img { max-height: 60px; vertical-align: middle; margin-left: 8px; border: 1px solid #ddd; }
    pre { background: #f0f2f6; padding: 8px; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>📁 Document Center</h1>
  <p>Allowed: jpg, jpeg, png, gif, webp, pdf, txt, csv · max 5 MB per file, 20 MB per request.</p>

  <!-- enctype="multipart/form-data" is REQUIRED for file uploads; the input name must match @RequestParam("file") -->
  <fieldset>
    <legend>Upload one file</legend>
    <form id="single" action="/api/files" method="post" enctype="multipart/form-data">
      <input type="file" name="file" required>
      <button type="submit">Upload</button>
    </form>
  </fieldset>

  <!-- "multiple" lets the user pick several files; all are sent with the same name "files" -->
  <fieldset>
    <legend>Upload several files</legend>
    <form id="multi" action="/api/files/batch" method="post" enctype="multipart/form-data">
      <input type="file" name="files" multiple required>
      <button type="submit">Upload all</button>
    </form>
  </fieldset>

  <h2>Stored files</h2>
  <ul id="list"><li>Loading…</li></ul>
  <pre id="result"></pre>

  <script>
    // Send the forms with fetch() so we stay on this page and can show the JSON answer
    for (const id of ["single", "multi"]) {
      document.getElementById(id).addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.target;
        const response = await fetch(form.action, { method: "POST", body: new FormData(form) });
        document.getElementById("result").textContent = response.status + "\n" + await response.text();
        form.reset();
        loadList();
      });
    }

    async function loadList() {
      const files = await (await fetch("/api/files")).json();
      const list = document.getElementById("list");
      list.replaceChildren();
      if (files.length === 0) { list.innerHTML = "<li>No files yet.</li>"; return; }
      for (const f of files) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = f.downloadUrl;
        a.textContent = f.originalName + " (" + f.size + " bytes)";   // textContent = no HTML injection
        li.append(a);
        if (f.contentType.startsWith("image/")) {
          const img = document.createElement("img");
          img.src = f.viewUrl;
          img.alt = f.originalName;
          li.append(img);
        }
        list.append(li);
      }
    }
    loadList();
  </script>
</body>
</html>
