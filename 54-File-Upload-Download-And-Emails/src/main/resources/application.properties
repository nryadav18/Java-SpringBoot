# ==========================================================
# Topic 54 - File Upload, Download and Emails
# ==========================================================
spring.application.name=document-center
server.port=8080

# ---------- multipart (file upload) limits ----------
# multipart is ON by default in Spring Boot; these are the important knobs
spring.servlet.multipart.enabled=true
# max size of ONE file (default 1MB)
spring.servlet.multipart.max-file-size=5MB
# max size of the WHOLE request, all files together (default 10MB)
spring.servlet.multipart.max-request-size=20MB
# files bigger than this are written to a temp file on disk instead of kept in memory
spring.servlet.multipart.file-size-threshold=512KB
# Tomcat stops reading ("swallowing") a too-large upload after 2MB and may RESET the connection,
# so the client never sees our nice 413 message. Let Tomcat read a bit more before giving up.
server.tomcat.max-swallow-size=50MB

# ---------- our storage settings (StorageProperties record) ----------
# relative to the folder you start the app from -> .../54-File-Upload-Download-And-Emails/uploads
app.storage.location=uploads
app.storage.allowed-extensions=jpg,jpeg,png,gif,webp,pdf,txt,csv

# ---------- email (JavaMailSender) ----------
# Mailpit - a FAKE SMTP server for development (docker compose up -d). Web inbox: http://localhost:8025
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.default-encoding=UTF-8
# Fail fast (3 s) instead of hanging when the mail server is not running
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
app.mail.from=no-reply@shop.example

