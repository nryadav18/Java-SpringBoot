# =====================================================================
# Topic 39 - JPA Queries - application settings
# =====================================================================
spring.application.name=jpa-queries
server.port=8080

spring.datasource.url=jdbc:h2:mem:librarydb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Show the SQL that each query method produces - the best way to learn this topic!
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# data.sql (sample books) normally runs BEFORE Hibernate creates the tables.
# This flag says: "first let Hibernate create the tables, THEN run data.sql".
spring.jpa.defer-datasource-initialization=true
