# Topic 34 - Validation
spring.application.name=validation
server.port=8080

# ------------------------------------------------------------------
# By DEFAULT Spring Boot's error JSON for a validation failure is only:
#   {"timestamp":"...","status":400,"error":"Bad Request","path":"/api/users"}
# The client cannot see WHICH field was wrong.
#
# These two settings add the message and the list of field errors to that
# default JSON. They are handy while LEARNING, but the output is long and
# technical. In topic 35 we replace this with our own clean error format
# (@RestControllerAdvice), which is what real projects do.
#
# Try it: comment both lines out (#), restart, and send an invalid request.
# ------------------------------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always
