# ------------------------------------------------------------
# Topic 56 - GraphQL with Spring
# ------------------------------------------------------------
spring.application.name=graphql-library
server.port=8080

# The ONE endpoint for every GraphQL query and mutation (this is the default value).
spring.graphql.path=/graphql

# GraphiQL = an in-browser IDE to write and run queries: http://localhost:8080/graphiql
spring.graphql.graphiql.enabled=true

# Expose the schema as text at http://localhost:8080/graphql/schema (handy for learning).
spring.graphql.schema.printer.enabled=true

# Where schema files live (this is the default value): src/main/resources/graphql/*.graphqls
spring.graphql.schema.locations=classpath:graphql/

# See our "how many times was the author loader called?" log lines.
logging.level.com.course.graphql=DEBUG
