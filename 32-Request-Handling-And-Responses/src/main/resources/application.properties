# Topic 32 - Request Handling & Responses
spring.application.name=request-handling
server.port=8080

# Pretty-printed JSON while learning
spring.jackson.serialization.indent-output=true

# Include error messages in Spring Boot's default error JSON (topic 35 does this properly)
server.error.include-message=always

# Fail when the client sends a JSON field we do not know (e.g. a typo like "prise").
# The default is false (unknown fields are silently ignored). Try both!
spring.jackson.deserialization.fail-on-unknown-properties=true
