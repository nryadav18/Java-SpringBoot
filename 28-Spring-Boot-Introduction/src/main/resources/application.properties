# Topic 28 - Spring Boot Introduction
# This file is read automatically by Spring Boot at startup.
# Topic 29 covers configuration in depth - here are just a few friendly settings.

# The name of our application (shows up in logs and in Actuator)
spring.application.name=boot-intro

# The port of the embedded Tomcat web server (8080 is already the default; shown for clarity)
server.port=8080

# Expose only the "health" and "info" Actuator endpoints over HTTP
management.endpoints.web.exposure.include=health,info

# Uncomment to see the auto-configuration "CONDITIONS EVALUATION REPORT" at startup
# (same as starting the app with --debug)
#debug=true
