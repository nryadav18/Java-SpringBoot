# ------------------------------------------------------------
# Topic 49 - JWT Authentication
# ------------------------------------------------------------
spring.application.name=jwt-auth
server.port=8080

# ---- Database (H2 in memory) ----
spring.datasource.url=jdbc:h2:mem:jwtdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ---- JWT settings (bound to the JwtProperties record) ----
# The secret must be Base64 text of at least 32 RANDOM bytes (256 bits) for HS256.
# Generate your own, e.g. in PowerShell:
#   [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 }))
# or with openssl:  openssl rand -base64 32
# ${JWT_SECRET:...} = use the JWT_SECRET environment variable if set, else this DEV-ONLY default.
# NEVER commit a real production secret to Git.
app.jwt.secret=${JWT_SECRET:VPRUfjavGU03Le4EyEe/zdh5sHYm5ZtiWXxqhb3pf0o=}
# Short-lived access tokens limit the damage if one is stolen
app.jwt.expiration=15m
app.jwt.issuer=food-delivery-api

# DEBUG shows our filter's "Rejected JWT: ..." messages and the security filter chain
logging.level.com.course.jwtauth.security=DEBUG
