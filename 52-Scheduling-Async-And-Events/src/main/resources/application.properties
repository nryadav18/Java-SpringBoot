# ==========================================================
# Topic 52 - Scheduling, Async and Events
# ==========================================================
spring.application.name=scheduling-async-events
server.port=8080

# ---------- database (H2 in-memory) ----------
spring.datasource.url=jdbc:h2:mem:shopdb
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# ---------- scheduling ----------
# switch ALL @Scheduled jobs on/off (see SchedulingConfig)
app.scheduling.enabled=true
# Spring Boot's scheduler uses ONE thread by default -> one slow job delays all others.
# Two threads let jobs run side by side. The prefix shows up in the log as [sched-1], [sched-2].
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=sched-

# job timings (milliseconds) and cron expression
app.jobs.initial-delay-ms=5000
app.jobs.heartbeat-rate-ms=20000
app.jobs.retry-delay-ms=30000
# sec min hour day-of-month month day-of-week  -> at second 0 of every minute (demo only)
app.jobs.daily-report-cron=0 * * * * *
# a real nightly job would be:  0 0 2 * * *   (every day at 02:00)
app.jobs.zone=Asia/Kolkata

# ---------- graceful shutdown ----------
# let the scheduler finish a running job before the app stops
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=10s
