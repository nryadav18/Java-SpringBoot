# ------------------------------------------------------------
# Topic 55 - Reactive Programming with WebFlux
# ------------------------------------------------------------
spring.application.name=reactive-webflux
server.port=8080

# R2DBC connection to an in-memory H2 database.
# Note the URL starts with "r2dbc:" and NOT "jdbc:".
spring.r2dbc.url=r2dbc:h2:mem:///shopdb;DB_CLOSE_DELAY=-1
spring.r2dbc.username=sa
spring.r2dbc.password=

# Run schema.sql + data.sql at startup (works with R2DBC too).
spring.sql.init.mode=always

# Base URL used by our WebClient demo. It calls THIS same app, so it works offline.
app.webclient.base-url=http://localhost:${server.port}

# Show what Reactor/Netty is doing (keep INFO for beginners).
logging.level.com.course.webflux=DEBUG
