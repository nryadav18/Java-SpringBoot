# Topic 30 - Logging in Spring Boot
spring.application.name=food-delivery
server.port=8080

# ---------------- Log levels ----------------
# Order: TRACE < DEBUG < INFO < WARN < ERROR   (and OFF)
# A logger prints messages at its level AND everything more serious.
# The root logger (everything) stays at INFO; our own package is more detailed.
logging.level.root=INFO
logging.level.com.course.loggingdemo=DEBUG

# Quieter / louder logs for specific libraries:
logging.level.org.springframework.web=INFO
# logging.level.org.springframework.web=DEBUG     <- shows every request mapping decision
# logging.level.org.hibernate.SQL=DEBUG           <- (later, with JPA) shows SQL statements

# ---------------- Log groups ----------------
# Give several packages one short name and set them together.
logging.group.food=com.course.loggingdemo
# logging.level.food=TRACE

# ---------------- Logging to a file WITHOUT logback-spring.xml ----------------
# If you DELETE logback-spring.xml, these simple properties are enough to log to a rolling file:
# logging.file.name=logs/food-delivery.log
# logging.logback.rollingpolicy.max-file-size=10MB
# logging.logback.rollingpolicy.max-history=7
# In THIS project, logback-spring.xml takes control of appenders and file names.
