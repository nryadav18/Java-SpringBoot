# =====================================================================
# Topic 42 - Transactions - application settings
# =====================================================================
spring.application.name=transactions
server.port=8080

spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# In this topic we care about TRANSACTIONS more than SQL, so SQL logging is off...
spring.jpa.show-sql=false
# ...and instead the transaction manager tells us what it does:
#   "Creating new transaction with name [...TransferService.transfer]"
#   "Suspending current transaction, creating new transaction ..."   (REQUIRES_NEW)
#   "Initiating transaction rollback" / "Initiating transaction commit"
logging.level.org.springframework.orm.jpa.JpaTransactionManager=DEBUG
