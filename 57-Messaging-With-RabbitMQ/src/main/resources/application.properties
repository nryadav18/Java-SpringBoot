# ------------------------------------------------------------
# Topic 57 - Messaging with RabbitMQ
# ------------------------------------------------------------
spring.application.name=rabbitmq-orders
server.port=8080

# Where is RabbitMQ? (these are the defaults, written out so you can see them)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ---- Consumer retries ----
# If a @RabbitListener throws, retry IN MEMORY up to 3 attempts in total,
# waiting 1s, then 2s (multiplier 2) between attempts.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
# After the last failed attempt, REJECT the message without requeue
# -> RabbitMQ sends it to the queue's dead-letter exchange (see RabbitConfig).
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Our own names, used by RabbitConfig / publisher / listeners.
app.rabbit.exchange=shop.orders.exchange
app.rabbit.notification-queue=shop.orders.notification
app.rabbit.analytics-queue=shop.orders.analytics
app.rabbit.dead-letter-exchange=shop.orders.dlx
app.rabbit.dead-letter-queue=shop.orders.notification.dlq
app.rabbit.broadcast-exchange=shop.announcements.fanout
app.rabbit.broadcast-queue=shop.announcements.inbox
