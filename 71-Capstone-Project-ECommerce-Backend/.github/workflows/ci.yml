# =====================================================================
# ShopEasy - Continuous Integration with GitHub Actions (topic 68)
#
# On every push and pull request to main:
#   1. check out the code
#   2. install Java 17 (with a Maven dependency cache)
#   3. mvn verify  -> compile + ALL tests (unit, @WebMvcTest, @SpringBootTest)
#   4. build the Docker image (and push it to Docker Hub on main, if the secrets are configured)
#
# GitHub only reads workflows from .github/workflows at the ROOT of a repository.
# Put this project in its own repository (or move this file to the root and set working-directory).
# =====================================================================
name: ShopEasy CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run all tests
        run: mvn -B verify

      - name: Upload test reports (also when tests fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  docker:
    needs: build-and-test                 # only if all tests passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/shopeasy:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/shopeasy:${{ github.sha }}
