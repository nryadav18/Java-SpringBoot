# =====================================================================
# Topic 43 - common settings + DEFAULT profile (H2 in-memory database)
# Run: mvn spring-boot:run
# =====================================================================
spring.application.name=flyway-mysql-demo

# ---------- H2 (default) ----------
# MODE=MySQL makes H2 behave a bit more like MySQL, so the same Flyway
# scripts work on both. DATABASE_TO_LOWER keeps table names lower-case like MySQL.
spring.datasource.url=jdbc:h2:mem:librarydb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# H2 web console: http://localhost:8080/h2-console  (JDBC URL as above, user sa)
spring.h2.console.enabled=true

# ---------- JPA / Hibernate ----------
# validate = Hibernate only CHECKS that entities match the tables.
# It never creates/changes tables. Flyway owns the schema now.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Flyway ----------
# These are already the defaults - written here so you can SEE them.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Show Flyway's log lines ("Migrating schema ... to version 1 - create books table")
logging.level.org.flywaydb=INFO
