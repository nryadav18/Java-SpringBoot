# =====================================================================
# Profile "mysql" - active ONLY when you start the app with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#   or  java -jar target/flyway-mysql-1.0.0.jar --spring.profiles.active=mysql
# Values here OVERRIDE the same keys in application.properties.
# Start MySQL first:  docker compose up -d
# =====================================================================

# jdbc:mysql://<host>:<port>/<database>?options
spring.datasource.url=jdbc:mysql://localhost:3306/librarydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# ${ENV_VAR:default} -> read from an environment variable, else use the default.
# In real production NEVER keep real passwords in this file.
spring.datasource.username=${DB_USERNAME:library_user}
spring.datasource.password=${DB_PASSWORD:library_pass}

# The driver class (com.mysql.cj.jdbc.Driver) is detected from the URL automatically.

# Connection pool size (HikariCP). Small is fine for a laptop.
spring.datasource.hikari.maximum-pool-size=5

# The H2 console makes no sense for MySQL
spring.h2.console.enabled=false
