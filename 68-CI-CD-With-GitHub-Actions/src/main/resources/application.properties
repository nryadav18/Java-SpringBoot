spring.application.name=shipping-app
server.port=8080

# Health endpoint for Docker / Kubernetes checks
management.endpoints.web.exposure.include=health,info

# Shown on /actuator/info (management.info.env.enabled turns on the "info.*" properties)
management.info.env.enabled=true
info.app.name=shipping-app
info.app.description=Built and tested by GitHub Actions
