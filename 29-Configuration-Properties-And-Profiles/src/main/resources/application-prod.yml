# =====================================================================
# PROD profile - activate with:  --spring.profiles.active=prod
# Production settings: real port, quiet logs, safe feature flags.
# Secrets are NOT written here - they come from environment variables.
# =====================================================================

server:
  port: 8081                    # a different port, so you can SEE the profile switch

shop:
  name: ShopEasy
  discount-percent: 0

features:
  new-checkout: false

logging:
  level:
    root: WARN
    com.course: INFO
