# ==========================================================
# "redis" profile - activate with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=redis
# Start Redis first:  docker compose up -d
# ==========================================================

# Use RedisCacheManager instead of the in-memory map
spring.cache.type=redis

# Where is the Redis server? (these are the defaults, written here so you can see them)
spring.data.redis.host=localhost
spring.data.redis.port=6379
# spring.data.redis.password=${REDIS_PASSWORD}     <- use an environment variable for real passwords
spring.data.redis.timeout=2s

# NOTE: TTL and JSON serialization are configured in CacheConfig.java (RedisCacheConfiguration bean).
# Without that bean you could set the TTL with a property instead:
# spring.cache.redis.time-to-live=10m
