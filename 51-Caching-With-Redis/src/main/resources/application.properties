# ==========================================================
# Topic 51 - Caching with Redis  (DEFAULT profile)
# Works WITHOUT Redis: caches live in a ConcurrentHashMap inside the JVM.
# ==========================================================
spring.application.name=caching-with-redis
server.port=8080

# Which cache store to use. "simple" = ConcurrentMapCacheManager (in-memory, no TTL).
# We set it explicitly because spring-boot-starter-data-redis is on the classpath and
# Spring Boot would otherwise pick Redis automatically.
spring.cache.type=simple

# Optional: pre-create these caches at startup (otherwise they are created on first use)
spring.cache.cache-names=products,productSearch

# We do not use Spring Data Redis repositories - skip scanning for them
spring.data.redis.repositories.enabled=false

# How slow our fake database is (milliseconds per query)
app.slow-database.delay-ms=2000

# Show the cache decisions of Spring (very helpful while learning)
# TRACE on the interceptor package prints "Cache entry for key '1' found in cache 'products'"
logging.level.org.springframework.cache.interceptor=TRACE
logging.level.com.course.caching=INFO
