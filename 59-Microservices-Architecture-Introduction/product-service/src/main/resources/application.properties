# ------------------------------------------------------------------
# product-service configuration (Topic 59)
# ------------------------------------------------------------------
# The name of this service. In the next topics (Eureka, Gateway) this
# name becomes VERY important - other services will find us by it.
spring.application.name=product-service

# Every microservice on your laptop needs its OWN port.
# product-service = 8081, order-service = 8082
server.port=8081

# Expose only the health endpoint: http://localhost:8081/actuator/health
management.endpoints.web.exposure.include=health
