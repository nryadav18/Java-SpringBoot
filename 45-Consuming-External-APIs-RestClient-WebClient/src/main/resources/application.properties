# =====================================================================
# Topic 45 - calling external APIs
# Run (internet): mvn spring-boot:run
# Run (offline) : mvn spring-boot:run -Dspring-boot.run.profiles=offline
# =====================================================================
spring.application.name=api-client

# ---------- The external API ----------
# Base URL in configuration, NEVER hard-coded in Java: it differs per environment
# (test server, production, a mock ...).
external.jsonplaceholder.base-url=https://jsonplaceholder.typicode.com

# Max time to OPEN a connection, and max time to WAIT for the answer.
# Without timeouts one slow API can freeze all threads of your app!
external.jsonplaceholder.connect-timeout=3s
external.jsonplaceholder.read-timeout=5s

# Show the client classes' log lines
logging.level.com.course.apiclient=INFO
