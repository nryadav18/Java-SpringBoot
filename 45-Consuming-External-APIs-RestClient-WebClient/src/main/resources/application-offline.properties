# =====================================================================
# Profile "offline": call our OWN mock (MockJsonPlaceholderController)
# instead of the real internet API.
#   mvn spring-boot:run -Dspring-boot.run.profiles=offline
#
# ${server.port:8080} = the port this app runs on (8080 unless you change it),
# so the app calls itself: http://localhost:8080/mock-api/posts/1
# =====================================================================
external.jsonplaceholder.base-url=http://localhost:${server.port:8080}/mock-api
