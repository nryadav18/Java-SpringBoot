# ------------------------------------------------------------
# Topic 48 - Spring Security with Database Users and Roles
# ------------------------------------------------------------
spring.application.name=db-security
server.port=8080

# H2 in-memory database (data disappears on restart - fine for learning)
spring.datasource.url=jdbc:h2:mem:notesdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# H2 web console at /h2-console (permitted in SecurityConfig - learning only!)
spring.h2.console.enabled=true

# Turn to DEBUG to watch the filter chain and the authorization decisions
logging.level.org.springframework.security=INFO
