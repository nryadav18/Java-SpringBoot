# Topic 65 - Zipkin server for viewing traces
#   Start:  docker compose up -d        UI: http://localhost:9411
#   Stop:   docker compose down
# Zipkin keeps spans IN MEMORY here (lost on restart) - fine for learning.
services:
  zipkin:
    image: openzipkin/zipkin:3
    container_name: course-zipkin
    ports:
      - "9411:9411"     # host:container - the UI and the span collector API
