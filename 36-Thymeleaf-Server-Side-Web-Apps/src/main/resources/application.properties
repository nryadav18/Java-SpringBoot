# Topic 36 - Thymeleaf Server-Side Web Apps
spring.application.name=thymeleaf-todo
server.port=8080

# Thymeleaf defaults (written here so you can see them):
#   templates are loaded from classpath:/templates/ and end with .html
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Development tip: do not cache templates, so a changed .html file is picked up
# (after it is copied to target/classes - VS Code does that on save while the app runs).
# In production keep the default (true) - caching is much faster.
spring.thymeleaf.cache=false
