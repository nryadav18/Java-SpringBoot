<!DOCTYPE html>
<!--
  todos/form.html - ONE template for both "new" and "edit".
  Model attributes: todoForm (TodoForm), editMode (boolean), priorities (Priority[]).

  th:object="${todoForm}"  selects the form-backing object.
  th:field="*{title}"      *{...} means "property of the selected object". It generates
                           id="title", name="title" and value="(current value)".
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editMode} ? 'Edit todo' : 'New todo')}">
    <title>Todo form</title>
</head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <h1 th:text="${editMode} ? 'Edit todo' : 'New todo'">New todo</h1>

    <!--
      novalidate = turn OFF the browser's own checks, so you can SEE the server-side
      validation working. (In a real app you can keep both: browser checks are nice for
      the user, server checks are required for safety.)
    -->
    <form class="card-form" method="post" novalidate
          th:object="${todoForm}"
          th:action="${editMode} ? @{/todos/{id}(id=${todoForm.id})} : @{/todos}">

        <!-- Errors not tied to one field (e.g. from a class-level validator) -->
        <div class="error-box" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Global error</p>
        </div>

        <div class="field">
            <label for="title">Title *</label>
            <!-- th:errorclass adds the CSS class "invalid" only when this field has an error -->
            <input type="text" th:field="*{title}" th:errorclass="invalid" placeholder="What needs to be done?">
            <!-- th:errors prints the validation message(s) for this field -->
            <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title is required</p>
        </div>

        <div class="field">
            <label for="description">Description</label>
            <textarea th:field="*{description}" th:errorclass="invalid" rows="3"></textarea>
            <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Too long</p>
        </div>

        <div class="row">
            <div class="field">
                <label for="priority">Priority *</label>
                <!-- th:field on <select> automatically marks the current value as "selected" -->
                <select th:field="*{priority}" th:errorclass="invalid">
                    <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.label}">Medium</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('priority')}" th:errors="*{priority}">Choose one</p>
            </div>

            <div class="field">
                <label for="dueDate">Due date</label>
                <!-- type="date" sends yyyy-MM-dd; @DateTimeFormat(iso = DATE) on TodoForm converts it -->
                <input type="date" th:field="*{dueDate}" th:errorclass="invalid">
                <p class="error" th:if="${#fields.hasErrors('dueDate')}" th:errors="*{dueDate}">Bad date</p>
            </div>
        </div>

        <!-- Only shown when editing -->
        <div class="field checkbox" th:if="${editMode}">
            <input type="checkbox" th:field="*{done}">
            <label th:for="${#ids.prev('done')}">Done</label>
        </div>

        <div class="buttons">
            <button type="submit" class="btn" th:text="${editMode} ? 'Save changes' : 'Add todo'">Add todo</button>
            <a class="btn secondary" th:href="@{/todos}">Cancel</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
