# ------------------------------------------------------------------
# order-service configuration (Topic 61)
# ------------------------------------------------------------------
spring:
  application:
    name: order-service        # the gateway route uses lb://order-service
  cloud:
    loadbalancer:
      cache:
        ttl: 5s                # DEV ONLY (default 35s)

server:
  port: 8082
  error:
    include-message: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5      # DEV ONLY
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5     # DEV ONLY
    lease-expiration-duration-in-seconds: 15 # DEV ONLY

management:
  endpoints:
    web:
      exposure:
        include: health,info
