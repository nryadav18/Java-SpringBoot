# ==========================================================
# "dev" profile - LEARNING ONLY. Exposes EVERY actuator endpoint, including
# /actuator/env, /beans, /mappings, /configprops, /threaddump, /heapdump.
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
# NEVER use these settings on a server that others can reach.
# ==========================================================
management.endpoints.web.exposure.include=*

# Show real values in /actuator/env and /actuator/configprops (they are masked as ****** by default)
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
