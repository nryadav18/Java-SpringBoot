# ==========================================================
# Topic 53 - Actuator, Monitoring and Observability (DEFAULT profile = "safe" settings)
# ==========================================================
spring.application.name=order-service
server.port=8080

# ---------- Which actuator endpoints are reachable over HTTP? ----------
# By default ONLY "health" is exposed over HTTP. We add a few more that are safe-ish.
# NEVER expose "*" on a public server without Spring Security (env, heapdump, beans... leak secrets & internals).
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
# The base path is /actuator by default:
# management.endpoints.web.base-path=/actuator
# Tip for production: serve actuator on a separate, internal-only port:
# management.server.port=9090

# ---------- health ----------
# never | when-authorized | always.  "always" is fine for learning; use when-authorized in production.
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
# Kubernetes-style probes: /actuator/health/liveness and /actuator/health/readiness
management.endpoint.health.probes.enabled=true
# The app is only "ready" for traffic when the payment gateway is reachable too
management.endpoint.health.group.readiness.include=readinessState,paymentGateway

# ---------- info ----------
# The "env" contributor publishes every info.* property below
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
info.app.name=Order Service
info.app.description=Topic 53 demo - an order service that is easy to monitor
# @...@ values are filled in by Maven when it copies this file (resource filtering from spring-boot-starter-parent)
info.app.version=@project.version@
info.app.java-version=@java.version@
info.team.owner=checkout-team
info.team.slack=#checkout-alerts

# ---------- metrics ----------
# A common tag added to EVERY metric - lets one Grafana dashboard show many applications
management.metrics.tags.application=${spring.application.name}
# Percentile histogram for HTTP requests (needed for p95/p99 latency graphs in Grafana)
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ---------- logging ----------
# Our package logs INFO. Change it at runtime via POST /actuator/loggers/com.course.observability
logging.level.com.course.observability=INFO
