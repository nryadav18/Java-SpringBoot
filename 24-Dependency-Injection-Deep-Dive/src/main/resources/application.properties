# Settings for the QuickBite food-delivery demo (Topic 24).
# Loaded by @PropertySource("classpath:application.properties") in AppConfig
# and injected into ShopSettings with @Value("${...}").

shop.name=QuickBite
shop.delivery-fee=40.0
shop.free-delivery-above=300
shop.max-items-per-order=20
# comma-separated text -> Spring converts it into a String[]
shop.cities=Hyderabad,Pune,Chennai

# shop.support-email is intentionally NOT here -> the default in @Value is used
